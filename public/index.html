<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nearby Connect</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#150f3d">
</head>
<body>

<div id="app">

  <!-- AUTH SCREEN -->
  <section id="screen-auth" class="screen auth-screen">
    <div class="auth-glow"></div>
    <div class="auth-content">
      <div class="logo-mark">
        <span class="logo-inner"></span>
      </div>
      <h1 class="brand">Nearby Connect</h1>
      <p class="tagline">Meet people within 1km, right now.</p>

      <div class="tabs">
        <button id="tab-login" class="tab active">Log in</button>
        <button id="tab-register" class="tab">Sign up</button>
      </div>
      <form id="form-auth">
        <input id="auth-username" placeholder="Username" autocomplete="username" required>
        <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" id="auth-submit" class="gradient-btn">Log in</button>
        <p id="auth-error" class="error"></p>
      </form>
    </div>
  </section>

  <!-- MAIN SCREEN -->
  <section id="screen-main" class="screen hidden">
    <header>
      <h1>Nearby Connect</h1>
      <button id="btn-logout" class="link">Log out</button>
    </header>

    <nav class="bottom-nav">
      <button id="nav-nearby" class="nav-btn active">Nearby</button>
      <button id="nav-connections" class="nav-btn">Connections<span id="badge-requests" class="badge hidden"></span></button>
    </nav>

    <div id="view-nearby" class="view">
      <div class="view-heading">
        <h2>Users nearby</h2>
        <p id="location-status" class="muted">Getting your location…</p>
      </div>
      <ul id="nearby-list"></ul>
    </div>

    <div id="view-connections" class="view hidden">
      <div class="view-heading">
        <h2>Connections</h2>
      </div>
      <ul id="connections-list"></ul>
    </div>

    <div id="view-chat" class="view hidden">
      <div class="chat-header">
        <button id="btn-back-chat" class="icon-link">&larr;</button>
        <span id="chat-avatar" class="avatar"></span>
        <div class="chat-header-meta">
          <span id="chat-with"></span>
          <span class="chat-sub">Connected</span>
        </div>
        <button id="btn-end-connection" class="link danger">End</button>
      </div>
      <ul id="chat-messages"></ul>
      <div id="sticker-picker" class="sticker-picker hidden"></div>
      <form id="form-chat">
        <button type="button" id="btn-sticker" class="icon-btn" title="Send a sticker">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.7"/>
            <circle cx="9" cy="10" r="1.2" fill="white"/>
            <circle cx="15" cy="10" r="1.2" fill="white"/>
            <path d="M8 14.5c1 1.3 2.4 2 4 2s3-0.7 4-2" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
        <input id="chat-text" placeholder="Message…" autocomplete="off">
        <button type="submit" class="send-btn">➤</button>
      </form>
    </div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
